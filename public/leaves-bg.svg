<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f0d5"/><stop offset="1" stop-color="#6da66a"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#wash)"/>
  <g filter="url(#blur)" opacity=".85" fill="#3f873e">
    <ellipse cx="180" cy="120" rx="250" ry="75" transform="rotate(35 180 120)"/>
    <ellipse cx="480" cy="-30" rx="280" ry="85" transform="rotate(-25 480 -30)"/>
